<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon Code Promo</title>

    <link rel="stylesheet" href="resultat.css">

    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="topbar">

    <div class="logo">

        <img src="assets/logo.png" alt="Logo">

        <span>Voucher<span class="pink">Checker</span></span>

    </div>

    <nav>

        <a href="#">Nous contacter</a>

        <a href="#">Code promo en ligne</a>

        <a href="#">Demander un remboursement</a>

    </nav>

</header>

<!-- ================= TITRE ================= -->

<section class="hero">

    <h1>MON CODE PROMO</h1>

</section>

<!-- ================= CARTE ================= -->

<div class="dashboard">

    <div class="left">

        <div class="balance">

            <i class="fa-solid fa-wallet"></i>

            <span>Solde disponible</span>

            <h2>0 €</h2>

        </div>

        <hr>

        <div class="details">

            <div class="ligne">

                <span>Statut</span>

                <strong class="active">

                    <i class="fa-solid fa-circle"></i>

                    Active

                </strong>

            </div>

            <div class="ligne">

                <span>Montant maximum</span>

                <strong>150 €</strong>

            </div>

            <div class="ligne">

                <span>Numéro de série</span>

                <strong id="serial">----------</strong>

            </div>

        </div>

    </div>

    <div class="right">

        <button>

            <i class="fa-solid fa-clock-rotate-left"></i>

            Historique

        </button>

        <button>

            <i class="fa-solid fa-money-bill-transfer"></i>

            Demander un remboursement

        </button>

        <button>

            <i class="fa-solid fa-right-from-bracket"></i>

            Déconnexion

        </button>

    </div>

</div>

<footer>

    © 2026 VoucherChecker — Tous droits réservés.

</footer>

<script src="resultat.js"></script>

</body>

</html>
